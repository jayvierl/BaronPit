name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit  production dependencies
        run: npm audit --omit=dev --audit-level=high      
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check types including generated routes
        run: npx --no-install tsc --noEmit --incremental false
      - name: Exercise the production build with synthetic data
        run: npm run smoke
      - name: Install browsers for the tag picker regression
        run: npx --no-install playwright install --with-deps webkit chromium
      - name: Exercise touch and keyboard tagging
        run: |
          node scripts/smoke/tag-picker.mjs webkit
          node scripts/smoke/tag-picker.mjs chromium
      - name: Exercise desktop and mobile player match review
        run: node scripts/smoke/player-match-review.mjs
      - name: Exercise sign-in and two-account match discussions
        env:
          SMOKE_SCREENSHOTS: ${{ runner.temp }}/match-discussion
        run: node scripts/smoke/match-discussion-demo.mjs
